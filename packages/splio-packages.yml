  version: null
  published: null
  note: >-
    CDN-distributed, no registry metadata endpoint and no pinned version in the URL — the path
    segment `v1` is a floating major channel, so a consumer cannot tell which build they are
    loading and neither can we. The only currency signal the CDN exposes is the HTTP
    Last-Modified header on the bundle, observed 2026-08-17 (probed 2026-08-29, HTTP 200,
    774,542 bytes). Not on npm, unpkg or jsDelivr.
  capabilities:
  - JWT (authType jwt) initialisation via splioSDK.init()
  - display modes inline, popup and widget
  - loyalty points balance, tier progress and reward earn/redeem UI
  - CSS customisation through the .splio-display class
