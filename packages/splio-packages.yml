method: searched
source: >-
  npm registry search, PyPI, Packagist, proxy.golang.org, RubyGems, crates.io, GitHub org
  https://github.com/Splio, and the Splio developer docs at https://dev-scp.splio.com/llms.txt
summary:
  official_count: 1
  third_party_count: 3
  registries_searched:
  - npm
  - PyPI
  - Packagist
  - pkg.go.dev / proxy.golang.org
  - RubyGems
  - crates.io
  - Maven Central
  - NuGet
  note: >-
    Splio publishes no first-party SDK to any package registry. The only first-party client
    distribution is the Loyalty Web Kit, a browser JavaScript bundle served from Splio's own CDN at
    static.splio.pro. The GitHub organisation https://github.com/Splio exists (Paris, France,
    contact@splio.com) but holds exactly one public repo, a PHP user-agent parser last pushed in
    2016 — it is not an SDK org. Everything else that carries the Splio name on a registry is
    community-authored and unmaintained.
packages:
