abandonment_signal:
  assessment: >-
    No first-party SDK exists to decay, so the usual "SDK older than the API" signal does not
    apply. The relevant finding is the inverse: Splio shipped Splio Edition 2025 with four new
    REST APIs (Messaging, Campaign, Content, Interactions) and no client library for any of them
    in any language. Integrators either hand-roll HTTP or use one of the packaged connectors
    (Shopify, Magento, PrestaShop, Make) instead. The one first-party client, the Loyalty Web Kit,
    is current — its CDN bundle was rebuilt 2026-08-17.
