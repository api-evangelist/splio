- name: Splio Referral API
  description: >-
    Referral coupon API published as a public Postman collection. Checks and burns coupons for a
    referrer or a newly referred prospect, authenticated by a SHA-256 hash of the coupon code
    concatenated with a key issued by the Splio project manager.
