- name: Splio Messaging API
  description: >-
    Transactional and triggered messaging endpoint introduced with Splio Edition 2025. A single
    POST /messages call sends email to one or more recipients from a universe-scoped base URL,
    accepting an existing design or inline content plus Liquid personalisation variables.
  humanURL: https://dev-scp.splio.com/reference/post_messages
  baseURL: https://api.splio.com/messaging/v1/{universe_id}
  tags:
