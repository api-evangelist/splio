- name: Splio Content API
  description: >-
    Content creation API for Splio Edition 2025. POST /v1/create-email-design uploads an HTML file or
    a structured ZIP (index.html plus an images/ folder) and returns the email_design UUID that the
    Campaign and Messaging APIs then reference.
  humanURL: https://dev-scp.splio.com/reference/post_v1-create-email-design
  baseURL: https://api.splio.com/content
