- name: Splio Interactions API
  description: >-
    Event ingestion API for behavioural interactions. POST /events/ and POST /events/bulk push custom
    customer events into the Splio Customer Platform so they can trigger automations and feed the CDP.
  humanURL: https://dev-scp.splio.com/docs/datahub-events
  baseURL: https://api.splio.com
