- name: Splio Customer Platform API
  description: >-
    The core JWT-authenticated REST API for the Splio Customer Platform: authenticate for a 24-hour
    token, then manage contacts and their custom fields, membership lists, email/SMS blacklists,
    orders, abandoned carts, products and stores, build targeting groups and filters, and drive the
    loyalty engine — members, point balances, tiers, programs, and reward creation, grant and burn.
  humanURL: https://dev-scp.splio.com/reference/authentication-2
