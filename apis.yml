aid: splio
name: Splio
description: >-
  Splio is a Paris-headquartered customer marketing platform for retail, e-commerce, restaurant and
  travel brands, combining a Customer Data Platform, omnichannel marketing automation (email, SMS,
  WhatsApp, push), loyalty and rewards programs, mobile wallet cards and Tinyclues-derived predictive
  AI targeting into one "Splio Customer Platform". Brands integrate it through a JWT-authenticated
  REST API on api.splio.com covering contacts, custom fields, blacklists, orders, abandoned carts,
  products, stores, targeting groups and filters, loyalty members, points, tiers, programs and reward
  grant/burn, plus separate Messaging, Campaign, Content and Interactions APIs, a Datahub SFTP/CSV
  import path, and packaged connectors for Shopify, Magento, PrestaShop, Meta/Google/TikTok/Snapchat
  Ads, Criteo, Zendesk, OneSignal and Make.
url: https://raw.githubusercontent.com/api-evangelist/splio/refs/heads/main/apis.yml
image: https://splio.com/wp-content/uploads/2022/05/3250_Splio_Logo_RGB-2.png
x-type: company
x-source: harvest:secondary-market
specificationVersion: '0.20'
created: '2026-08-29'
modified: '2026-08-29'
tags:
- marketing-automation
- customer-data-platform
- loyalty
- CRM
- email-marketing
- SMS
- mobile-wallet
- Retail
