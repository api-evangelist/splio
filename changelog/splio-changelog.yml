  docs: https://helpcenter.splio.com/kb/guide/en/changes-to-expect-with-the-messaging-api-J8dH3f5fbO/Steps/4289302
  note: >-
    The most consequential API entry in the stream. Introduced POST /messages
    (api.splio.com/messaging/v1/{universe_id}) and DEPRECATED the Trigger API — Splio states
    customers "must set up new feeds to the new messaging API" for personalisation, while the old
    Trigger API stays reachable for design changes only. SMTP Relay is explicitly unaffected. No
    sunset date was given.
