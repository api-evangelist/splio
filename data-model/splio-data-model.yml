gaps:
- >-
  One reusable component schema in 77 paths. Contact, Order, Product, Store, Member and Reward — the
  six entities the whole platform turns on — have no named schema, so every operation redefines
  them inline and no client can share a type across calls.
- >-
  Identity is split three ways with no cross-reference operation: contacts by a per-universe
  unique_key, sales data by the integrator's external_id, loyalty by card_code. Nothing in the API
  resolves one to another; the integrator must maintain the mapping.
