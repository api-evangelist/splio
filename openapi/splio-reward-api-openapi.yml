  /loyalty/v1/rewards/{id}/grant:
    post:
      summary: Grant a reward
      description: Grant a reward to a member that he can use.
      parameters:
      - name: id
        in: path
        required: true
        description: Reward external identifier.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - card_code
              properties:
                card_code:
                  example: '44010000002'
                  type: string
                quantity:
                  example: 2
                  type: integer
                  default: 1
                reason_msg:
                  example: Catching up summer's free cake offer.
                  type: string
                grant_date:
                  example: '2018-01-12 15:00:00'
                  type: string
                  pattern: ^\d\d\d\d-(0?[1-9]|1[0-2])-(0?[1-9]|[12][0-9]|3[01]) (00|[0-9]|1[0-9]|2[0-3]):([0-9]|[0-5][0-9]):([0-9]|[0-5][0-9])$
                burned_date:
                  example: '2018-01-12 15:00:00'
                  type: string
                  pattern: ^\d\d\d\d-(0?[1-9]|1[0-2])-(0?[1-9]|[12][0-9]|3[01]) (00|[0-9]|1[0-9]|2[0-3]):([0-9]|[0-5][0-9]):([0-9]|[0-5][0-9])$
                validity_start:
                  example: '2018-01-12 15:00:00'
                  type: string
                  pattern: ^\d\d\d\d-(0?[1-9]|1[0-2])-(0?[1-9]|[12][0-9]|3[01]) (00|[0-9]|1[0-9]|2[0-3]):([0-9]|[0-5][0-9]):([0-9]|[0-5][0-9])$
                validity_end:
