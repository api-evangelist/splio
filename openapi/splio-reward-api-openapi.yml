      - Bearer: []
      operationId: getLoyaltyV2ContactsByIdRewards
      x-operation-id-source: derived
  /loyalty/v1/rewards:
    post:
      summary: Create a reward
      description: Create a new reward that can be given to members.
      requestBody:
        content:
          application/json:
            schema:
              required:
              - external_id
              - type
              - name
              - nqp_value
              - holding_days
              properties:
                auto_generated:
                  example: false
                  type: boolean
                  default: false
                custom_fields:
                  items:
                    $ref: '#/components/schemas/CustomField'
                  type: array
                description:
                  example: Description
                  type: string
                external_id:
                  example: ExternalID
                  type: string
                  maxLength: 128
                forced_validity:
                  example: false
                  type: boolean
                  default: false
                forced_validity_end:
                  example: '2018-01-12 15:34:22'
                  type: string
                  pattern: ^\d\d\d\d-(0?[1-9]|1[0-2])-(0?[1-9]|[12][0-9]|3[01]) (00|[0-9]|1[0-9]|2[0-3]):([0-9]|[0-5][0-9]):([0-9]|[0-5][0-9])$
                forced_validity_start:
                  example: '2018-01-12 15:34:22'
                  type: string
                  pattern: ^\d\d\d\d-(0?[1-9]|1[0-2])-(0?[1-9]|[12][0-9]|3[01]) (00|[0-9]|1[0-9]|2[0-3]):([0-9]|[0-5][0-9]):([0-9]|[0-5][0-9])$
                holding_days:
                  example: 10
                  type: integer
                image_url:
                  example: https://your_image.png
                  type: string
                limited:
                  example: false
                  type: boolean
                  default: false
                max_attribution_count:
                  example: 10
                  type: string
                monetary:
                  example: false
                  type: boolean
                  default: false
                monetary_type:
                  example: percentage
                  type: string
                  enum:
                  - percentage
                  - value
                monetary_value:
                  description: Value of the reward (in percentage or currency)
                  example: 5.5
                  type: number
                name:
                  example: Name
                  type: string
                  maxLength: 128
                nqp_value:
                  description: Non qualifying points price of the reward.
                  example: 1
                  type: integer
                rich_description:
                  example: Rich description
                  type: string
                validity_interval_count:
                  example: 10
                  type: integer
                validity_interval_type:
                  example: days
                  type: string
                  enum:
                  - days
                  - weeks
                  - months
                  - years
              type: object
        description: Create a reward.
        required: true
      responses:
        '201':
          description: Reward creation is successful.
          content:
            application/json:
              examples:
                response:
                  value:
                    name: the 4th given
                    external_id: E2
                    monetary: false
                    monetary_type: ''
                    monetary_value: 0
                    nqp_value: 4
                    description: An incredible cake
                    rich_description: ''
                    image_url: ''
                    holding_days: 10
                    validity_interval_type: months
                    validity_interval_count: 1
                    forced_validity: true
                    forced_validity_start: '2020-06-01 00:00:00'
                    forced_validity_end: '2020-09-01 00:00:00'
                    limited: true
                    auto_generated: true
                    max_attribution_count: 87
                    custom_fields:
                    - name: code_1
                      id: 0
                      value: test 2
        '400':
          description: The request validation failed.
          x-readme: BODYBODY
          content:
            application/json:
              examples:
                response:
                  value:
                    status: 400
                    errors:
                    - error_key: field_1
                      error: wrong_value
                      error_description: The request was malformed and it is unable to be processed. Please review and try again.
        '401':
          description: Authentication failed.
        '403':
          description: Forbidden.
      tags:
      - Reward
      security:
      - Bearer: []
      operationId: postLoyaltyV1Rewards
      x-operation-id-source: derived
