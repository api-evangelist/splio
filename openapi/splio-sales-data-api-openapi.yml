  /data/v2/orders/{id}:
    get:
      summary: Get an order/cart with its status
      description: Get a order or an abandoned cart based on its external_id, and get the status associated to the order as well.
      parameters:
      - name: id
        in: path
        required: true
        description: Order's external identifier.
        schema:
          type: string
          pattern: .+
      responses:
        '200':
          description: Order retrieval is successful.
          content:
            application/json:
              example:
                external_id: my_order12348
                contact_id: jdoe@email.com
                contact:
                  lastname: Hervet
                  firstname: Geoffrey
                  id: 1
                  contact_id: jdoe@email.com
                created_at: '2018-07-15 18:45:00'
                ordered_at: '2018-07-15 18:45:00'
                shipping_amount: 0
                discount_amount: 0
                total_price: 0.5
                tax_amount: 0.2
                sales_person: Mark Watney
                currency: EUR
                products:
                - external_id: '10'
                  name: Color Riche  - Vernis
                  description: 140 Martinez Cobal
                  brand: L'Oréal Paris
                  unit_price: 10.25
                  quantity: 2
                  discount_amount: 0
                  tax_amount: 0
                  currency: EUR
                  status: paid
                  total_line_amount: 20.5
                loyalty:
                  card_code: C0111191
                  id_program: 2
                store:
                  external_id: '2'
                  name: Champs élysées
                  online: false
                  store_type: retail
                  manager: Eric Sloane
                custom_fields:
                - id: 0
                  name: id_mail
                  value: ''
                status: paid
                status_lastupdate: '2018-07-15 18:45:00'
        '404':
          description: Order not found.
          content:
            application/json:
              example:
                status: 404
                errors:
                - error_key: ext_id
                  error: wrong_value
                  error_description: Order not found for given identifier.
        '400':
          description: The request validation failed.
          x-readme: BODYBODY
          content:
            application/json:
              example:
                status: 400
                errors:
                - error_key: field_1
                  error: wrong_value
                  error_description: The request was malformed and it is unable to be processed. Please review and try again.
        '401':
          description: Authentication failed.
        '403':
          description: Forbidden.
      tags:
      - Sales data
      security:
      - Bearer: []
    servers:
    - url: https://api.splio.com
    - url: http://api.splio.com
  /data/v3/orders/{id}:
    patch:
