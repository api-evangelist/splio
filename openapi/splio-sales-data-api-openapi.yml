                  tax_amount: 0
                  currency: EUR
                  total_line_amount: 20.5
                loyalty:
                  card_code: C0111191
                  id_program: 2
                store:
                  external_id: '2'
                  name: Champs élysées
                  online: false
                  store_type: retail
                  manager: Eric Sloane
                custom_fields:
                - id: 0
                  name: id_mail
