    patch:
      summary: Edit a contact
      description: Edit a contact.
      parameters:
      - name: individual_id
        in: path
        required: true
        description: contact unique key.
        schema:
          type: string
          pattern: .+
      requestBody:
        content:
          application/json:
            schema:
              description: Following the configuration set on the universe, the email OR cellphone OR unique_key can't be modified
              properties:
                key:
                  description: Key used to resolve the contact (default unique_key). Use internal_id to lookup by database ID.
                  example: unique_key
                  type: string
                  enum:
                  - unique_key
                  - internal_id
                lastname:
                  example: Doe
                  type: string
                firstname:
                  example: John
                  type: string
                creation_date:
                  description: 'This date of creation of this contact, will be used for trigger campaigns, Ex: Welcome email. Warning the timezone set for this date is the user api timezone and not the system timezone.'
                  example: '2018-01-24 15:00:00'
                  type: string
                  pattern: ^\d\d\d\d-(0?[1-9]|1[0-2])-(0?[1-9]|[12][0-9]|3[01]) (00|[0-9]|1[0-9]|2[0-3]):([0-9]|[0-5][0-9]):([0-9]|[0-5][0-9])$
                language:
                  description: en, fr, it, es, ...
                  example: en
                  type: string
                email:
                  example: jdoe@mysite.com
                  type: string
                cellphone:
                  example: '+331122334455'
                  type: string
                lists:
                  description: All current memberships of the contact will be removed and replaced by the ones given there. If you want to add or remove only specific list, please use end points /subscribe or /unsubscribe
                  example:
                  - id: 25
                    name: newsletter shoes
                  items:
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                    type: object
                  type: array
                double_optin:
                  description: "[Optional] **Require subscribers to confirm their subscription by sending a confirmation request.**<br />\n     <br />\n     **Legacy Version**<br />\n     - `message`: id of the message that must be sent. This message must contain a link to $confirmUrl$<br />\n     - `reminder`: id of the reminder message. This message must contain $confirmUrl$ as well.<br />\n     - `reminder_delay`: if you want a reminder to be sent, specify the number of days between the first message and the reminder.<br />\n     ```\n     {\n          \"message\": \"aw94xefgh\",\n          \"reminder\": \"94was76ef\",\n          \"reminder_delay\": 34\n     }\n     ```\n     <br />\n     **Splio Edition 2025**<br />\n     - `enabled`: Enable double optin<br />\n     ```\n     {\n          \"enabled\": true\n     }```"
                  type: object
                custom_fields:
                  example:
                  - name: foo
                    value: bar
                  - name: foo2
                    value: bar2
                  items:
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                      value:
                        description: The custom field value, can be an integer, a float, a string or a date at format YYYY-MM-DD HH:MM:SS, depending on the configuration of the custom field
                        type: string
                    type: object
                  type: array
                tracking_consent:
                  description: '[Optional] Track consent events for this contact. Each entry records a consent state change. The date is interpreted in the universe timezone.'
                  example:
                  - channel: email
                    scope: open
                    enabled: true
                    date: '2026-07-01 10:00:00'
                  items:
                    properties:
                      channel:
                        description: Consent channel. Currently only 'email' is supported.
                        example: email
                        type: string
                      scope:
                        description: Consent scope. Currently only 'open' is supported.
                        example: open
                        type: string
                      enabled:
                        description: 'Consent state: true = opted in, false = opted out.'
                        example: true
                        type: boolean
                      source:
                        description: '[Optional] Source of the consent action.'
                        example: shopify
                        type: string
                      date:
                        description: '[Optional] Date of the consent action in format YYYY-MM-DD HH:mm:ss (universe timezone). Defaults to current date if not provided.'
                        example: '2026-07-01 10:00:00'
                        type: string
                    type: object
                  type: array
              type: object
        description: Individual data.
        required: true
      responses:
        '200':
          description: contact edition is successful.
          content:
            application/json:
              examples:
                response:
                  value:
                    id: 1
                    lastname: Doe
                    firstname: John
