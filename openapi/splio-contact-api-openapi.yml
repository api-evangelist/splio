          x-readme: BODYBODY
          content:
            application/json:
              examples:
                response:
                  value:
                    status: 400
                    errors:
                    - error_key: field_1
                      error: wrong_value
                      error_description: The request was malformed and it is unable to be processed. Please review and try again.
        '401':
          description: Authentication failed.
        '403':
          description: Forbidden.
      tags:
      - Contact
      security:
      - Bearer: []
      operationId: getDataV1Lists
      x-operation-id-source: derived
  /data/contacts/{id}/lists/subscribe:
    post:
      summary: Subscribe a contact to list(s)
      description: Subscribe a contact to one or more lists.
      parameters:
      - name: id
        in: path
        required: true
        description: Contact unique key.
        schema:
          type: string
          pattern: .+
      requestBody:
        content:
          application/json:
            schema:
              required:
              - list_ids
              properties:
                list_ids:
                  items:
                    type: integer
                  type: array
              type: object
        description: Sucessful subscription to list(s).
        required: true
      responses:
        '200':
          description: Contact has been sucessfully subscribed to the list(s).
          content:
            application/json:
              examples:
                response:
                  value:
                    lastname: Doe
                    firstname: John
                    email: jdoe@splio.com
                    cellphone: 0612345678
                    creation_date: '2019-01-03 09:00:00'
                    language: fr
                    custom_fields:
                    - id: 0
                      name: My custom field 1
                      value: value1
                      data_type: string
                    lists:
                    - id: 50
                      name: Liste1
                    - id: 51
                      name: Liste2
        '400':
          description: The request validation failed.
          x-readme: BODYBODY
          content:
            application/json:
              examples:
                response:
                  value:
                    status: 400
                    errors:
                    - error_key: field_1
                      error: wrong_value
                      error_description: The request was malformed and it is unable to be processed. Please review and try again.
        '401':
          description: Authentication failed.
        '403':
          description: Forbidden.
        '404':
          description: Contact not found.
          content:
            application/json:
              examples:
                response:
                  value:
                    status: 404
                    errors:
                    - error_key: id
                      error: wrong_value
                      error_description: Contact not found for given identifier.
      tags:
      - Contact
      security:
      - Bearer: []
      operationId: postDataContactsByIdListsSubscribe
      x-operation-id-source: derived
