note: >-
  Splio publishes no pricing at all. There is no /pricing page in any of its ten language variants;
  the WordPress page sitemap lists 28 pages and none of them is a pricing, tarifs or plans page, and
  the site-wide llms.txt returns zero hits for pricing, tarif, prix or plan. Every commercial path on
  splio.com terminates in "Book a demo" or "Contact us". Licensing is real and tiered — the developer
  docs gate individual connectors on a "Required license or add-on" (for example the Webhook
  connector requires the Marketing Automation licence) and the Help Center maintains a
  "Understanding Splio's products and features" article — but the tiers, their contents and their
  prices are only disclosed inside a sales conversation.
