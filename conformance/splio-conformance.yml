certifications:
  published: false
  note: >-
    Splio publishes NO third-party security certification of its own — no SOC 2, ISO 27001,
    ISO 27701, HDS or PCI attestation appears on splio.com, in the privacy policy, in the legal
    notices or in the Help Center, and there is no trust centre at trust.splio.com (NXDOMAIN). The
    ISO 27001 / SOC 1 Type II / SOC 2 Type II certifications that surface in web searches for
    "Splio" belong to the INFRASTRUCTURE SUBPROCESSORS named in Splio's own subprocessors PDF, not
    to Splio. That distinction is recorded here deliberately so a reader does not inherit a
    certification Splio has not claimed.
