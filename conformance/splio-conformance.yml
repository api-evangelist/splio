method: searched
source: >-
  https://splio.com/en/personal-data-protection-policy/, https://splio.com/en/legal-notices/,
  https://splio.com/en/subprocessors-list/, https://splio.com/en/anti-spam-policy/,
  https://splio.com/en/cookies-policy/,
  https://helpcenter.splio.com/kb/guide/en/data-retention-policy-at-splio,
