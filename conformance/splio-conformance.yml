contract_quality_gaps:
- >-
  operationId is absent on every operation of the core Customer Platform spec (77 paths, ~86
  operations). A generator has nothing to name methods from. The Campaign API v1 spec is worse: it
  carries three operationIds and two of them are wrong — `get_new-endpoint` on a GET that is
  actually "Get a campaign", and `get_v1one-shot` on a POST.
- >-
  tags are absent from every operation in the Messaging, Campaign, Campaign v1 and Content specs;
  only the Customer Platform and Interactions specs tag their operations.
- >-
  429, 405, 502 and 503 are documented in the error reference but declared on zero operations in
  any spec.
- >-
  Five sibling specs each declare the same bearer-JWT scheme under a different name (Bearer, Token,
  Authorization, bearerAuth, BearerAuth), so a merged client sees five auth models where there is one.
- No operation anywhere carries `deprecated: true`, including paths Splio's own guides call legacy.
