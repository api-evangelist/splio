  https://dev-scp.splio.com/reference/rate-limiting — plus derived from the six specs in openapi/
conformance:
- id: openapi
  conforms: true
  evidence: >-
    Six machine-readable definitions published and enumerated in an RFC 9727 api-catalog. Five are
    OpenAPI 3.0.0 as served (openapi/*.json); the core Customer Platform document is additionally
    served from the API host itself as Swagger 2.0 at https://api.splio.com/doc.json, archived as
    openapi/_original/splio-doc-swagger2.json.
- id: swagger-2.0
  conforms: true
  evidence: >-
    openapi/_original/splio-doc-swagger2.json declares `"swagger": "2.0"`, host api.splio.com, 77 paths.
- id: rfc9727-api-catalog
  conforms: true
  evidence: >-
    https://dev-scp.splio.com/.well-known/api-catalog returns HTTP 200 with
    Content-Type application/linkset+json and a linkset[] enumerating all six API definitions with
    service-desc and service-doc links. Saved as well-known/splio-api-catalog.json.
- id: rfc9457
  conforms: false
  evidence: >-
    No operation in any spec declares application/problem+json. The published error contract at
    https://dev-scp.splio.com/reference/response-conventions-1 is a bespoke
    {status, errors[{error_key, error, error_description}]} envelope, with two further shapes for
    401/405 (bare string) and 429 ({"message": ...}).
- id: rfc6750-bearer
  conforms: true
  evidence: >-
    'Authorization: Bearer <JWT>' on every operation across all six specs; token minted by
    POST /authenticate and valid 24 hours.
- id: rfc7519-jwt
  conforms: true
  evidence: >-
    https://dev-scp.splio.com/reference/authentication-2 — 'Bearer xxxxxx.yyyyyyy.zzzzz', a
    three-segment JWT. The Loyalty Web Kit additionally requires the integrator to mint a JWT
    server-side (https://dev-scp.splio.com/recipes/loyalty-web-kit-build-your-jwt-server-side).
- id: oauth2
  conforms: false
  evidence: >-
    No oauth2 securityScheme in any spec; /.well-known/oauth-authorization-server and
    /.well-known/oauth-protected-resource return 404 on api.splio.com and dev-scp.splio.com.
- id: oidc
  conforms: false
  evidence: >-
    /.well-known/openid-configuration 404s on api.splio.com and dev-scp.splio.com (and 403s on
    splio.com). SAML/SSO exists for human application logins
    (https://dev-scp.splio.com/docs/authentication) but no OIDC discovery document is served.
- id: idempotency
  conforms: partial
  evidence: >-
    An `idempotency_key` request-BODY field on three operations only — POST /messages,
    POST /loyalty/v1/members/{card_code}/credit, POST /loyalty/v1/rewards/{id}/grant. No
    Idempotency-Key header anywhere; duplicates are refused rather than replayed. See
    conventions/splio-conventions.yml.
- id: pagination
  conforms: true
  evidence: >-
    page_number/per_page across data endpoints; before/after/limit cursors on the Loyalty module,
    with a documented migration from the former to the latter
    (https://dev-scp.splio.com/reference/loyalty-cursors-lists).
- id: rate-limit-headers
  conforms: partial
  evidence: >-
    429 plus rateLimit-limit / rateLimit-remaining / rateLimit-reset and
    x-rateLimit-limit-minute / x-rateLimit-remaining-minute
    (https://dev-scp.splio.com/reference/rate-limiting). Not the IETF draft header casing, and no
    Retry-After. Limited to `partial` because 429 is declared on zero operations in any spec.
- id: rfc9116-security-txt
  conforms: false
  evidence: >-
    /.well-known/security.txt returns 404 on api.splio.com and dev-scp.splio.com and 403 on
    splio.com. No security.txt is served anywhere on the estate.
- id: json:api
  conforms: false
  evidence: Bespoke JSON payloads; no application/vnd.api+json media type in any spec.
- id: scim
  conforms: false
  evidence: No SCIM schema URN in any spec (grep for urn:ietf:params:scim returns zero hits).
- id: odata
  conforms: false
  evidence: No $metadata surface and no OData query options in any spec.
- id: asyncapi
  conforms: false
  evidence: >-
    No AsyncAPI document and no subscribable event surface. Splio's event traffic is inbound only
    (Interactions API POST /events/, Datahub imports); its "webhook" feature is an outbound campaign
    step that calls a third-party API you configure, not an event notification you can subscribe to.
domain_standard:
  applicable: false
  market: customer marketing / CDP / loyalty (martech)
  evidence: >-
    No interoperability standard governs this market's contracts, and Splio declares none. The specs
    were checked for every signature the 0.12.0 domain_standard_conformance check looks for — SCIM
    URNs, OData $metadata, OpenRTB bid objects, Sparkplug topics, ActivityPub actors,
    LTI/OneRoster/Ed-Fi/Caliper/QTI shapes, OAI-PMH verbs, ORCID/DataCite/Crossref identifiers,
    HL7v2/X12/EDIFACT/ISO 20022 message types — and none is present. Splio's Mobile Wallets module
    does emit Apple PassKit, Google Wallet and Samsung Wallet passes, which ARE domain formats, but
    they are produced by the application and are not modelled anywhere in the published API
    contracts, so there is nothing in the spec to point at. Reward-only check: recorded as not
    applicable rather than failed.
