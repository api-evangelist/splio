format: custom-json
rfc9457: false
rfc9457_note: >-
  Splio does not use application/problem+json. No spec in the estate declares that media type and
  the published error reference describes a bespoke envelope instead.
envelopes:
- name: standard
  applies_to: 400 and most 4xx validation failures
  content_type: application/json
  example: |
    {
        "status": 400,
        "errors": [
            {
                "error_key": "payload",
                "error": "invalid_json",
                "error_description": "Json payload is invalid, verify its syntax."
            }
        ]
    }
  fields:
    status: HTTP status code, duplicated inside the body
    errors: array — an operation can report several field-level failures at once
    errors[].error_key: the payload element at fault
    errors[].error: machine-readable slug, the field a client should switch on
    errors[].error_description: human-readable explanation
- name: bare-string
  applies_to:
  - 401
  - 405
  content_type: application/json
  note: >-
    Authentication and method failures return a bare JSON string rather than the envelope —
    "Authentication failed." and "Method Not Allowed." A client that unconditionally reads
    body.errors[0] will crash on exactly the two failures it is most likely to hit first.
- name: rate-limit
  applies_to:
  - 429
  content_type: application/json
  example: '{ "message": "API rate limit exceeded" }'
  note: A third shape, keyed on `message`, used only for rate limiting.
status_codes:
- status: 400
  title: Bad Request
  occurrences_in_spec: 91
  meaning: Payload validation failed — malformed JSON, wrong custom-field type, bad email format,
    missing required field, or a batch where every item failed.
  known_slugs:
  - error: invalid_json
    error_key: payload
    error_description: Json payload is invalid, verify its syntax.
  - error: wrong_type
    error_key: custom_fields
    error_description: 'Custom field with id 5 and name Date_de_test must be of type date.'
  - error: wrong_email
    error_key: email
    error_description: The email given should have the right format
  remediation: Fix the payload. Retrying an identical request will fail identically.
- status: 401
  title: Not Authenticated
  occurrences_in_spec: 87
  meaning: Missing, malformed or expired JWT in the Authorization header.
  remediation: >-
    Re-authenticate with POST /authenticate using the universe API key. JWTs expire after 24 hours,
    so a long-running integration must refresh on a schedule; Splio explicitly warns against
    re-authenticating on every call.
- status: 403
  title: Forbidden
  occurrences_in_spec: 85
  meaning: Authenticated but not permitted for this universe or resource.
  remediation: Check the API user's rights in the universe admin section.
- status: 404
  title: Not Found
  occurrences_in_spec: 40
  meaning: The addressed contact, store, product, order, custom field, reward, reward attribution
    or campaign action does not exist in this universe.
  remediation: Verify the external_id / card_code / individual_id and the universe you authenticated against.
- status: 405
  title: Method Not Allowed
  occurrences_in_spec: 0
  documented_in: https://dev-scp.splio.com/reference/response-conventions-1
  meaning: An unsupported method on a valid endpoint (e.g. PUT where POST is expected).
