partial_success:
  status: 207
  occurrences_in_spec: 7
  note: >-
    Bulk contact create/delete/optout, blacklist add/delete and bulk reward grant/burn return
    207 Multi-Status on partial failure. This is the most dangerous case for an automated client:
    the status code is a success code, but some items in the batch did not apply. Per-item results
    must be read.
gaps:
- >-
  There is no published error-code registry. Slugs such as invalid_json, wrong_type and wrong_email
  are only visible as examples inside the response-conventions page; the full vocabulary is not
  enumerated anywhere, so a client cannot exhaustively switch on `error`.
- >-
  429 and 405 are documented in prose but declared on zero operations across all six specs, and 502
  and 503 likewise. A generated client will not know they can occur.
